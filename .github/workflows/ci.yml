name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # better-sqlite3 (a dev dependency) is what the DISK file tests run on.
      - run: npm ci
      - run: npm test

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
      - run: go test ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
        working-directory: python
      - run: python -m unittest discover -s tests -v
        working-directory: python

  # The three ports must agree. This runs the same cases through Python, JS and
  # Go and fails if any result differs (see "Checking port parity" in
  # docs/PUBLISHING.md).
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 tools/parity/check.py

  # Publishing is documented in docs/PUBLISHING.md but left commented out
  # here until NPM_TOKEN/PYPI_TOKEN is configured (Settings -> Secrets and
  # variables -> Actions) -- uncomment once you're ready to publish
